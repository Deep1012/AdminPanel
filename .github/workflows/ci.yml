name: CI

# Proves the repo builds and its tests pass. It does NOT deploy: both
# deployments are deliberately manual CLI invocations (see ARCHITECTURE.md),
# so a green run here is a signal, not a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The suite fakes every Mongoose model, so it needs no database and no
      # secrets. server.js is never required here, so the MONGO_URL/JWT_SECRET
      # fail-fast does not apply.
      - run: npm test

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # The project standardises on npm: the only committed lockfile is
      # frontend/package-lock.json. (package.json used to declare
      # packageManager yarn@1.22 with no yarn.lock behind it; that field was
      # removed so tooling and docs agree.)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npx craco test --watchAll=false
        env:
          CI: true

      # REACT_APP_BACKEND_URL is inlined at build time by CRA, so this
      # placeholder makes the artifact non-deployable on purpose. The job
      # proves the app COMPILES; it does not produce something shippable.
      - name: Build
        run: npx craco build
        env:
          CI: true
          REACT_APP_BACKEND_URL: https://ci-placeholder.invalid
